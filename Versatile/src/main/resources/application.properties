spring.application.name=Versatile

# ===================================================================
# DATASOURCE CONFIGURATION (Database Connection Details)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/aiInterview
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
# The SQL Dialect allows Hibernate to optimize SQL queries for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL-auto options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# Enable this to let Spring know DDL commands should be executed
spring.jpa.generate-ddl=true

# Show SQL queries in the console logs (great for debugging)
spring.jpa.show-sql=true

# Format the logged SQL queries to be easily readable
spring.jpa.properties.hibernate.format_sql=true
