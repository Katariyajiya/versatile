
spring.application.name=Versatile

# ===================================================================
# SERVER & UPLOAD LIMITS
# ===================================================================
server.port=${PORT:8080}
server.error.include-message=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# DATASOURCE (Reads Cloud Env Vars, falls back to local MySQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false


# ===================================================================
# GROQ CLOUD LLM (OpenAI-Compatible Free Tier)
# ===================================================================
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.replay-reasoning-content=false




